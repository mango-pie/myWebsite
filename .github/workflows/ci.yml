name: CI

# 门禁：PR 合入 main 前、以及推送到功能分支时，跑编译 + 单元测试。
# 需要完整上下文的 integration 测试默认跳过（见 pom.xml surefire excludedGroups）。
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - '.cursor/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile & unit test (mvn verify)
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
