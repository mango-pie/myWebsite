# 生产环境：java -jar app.jar --spring.profiles.active=prod
# 敏感项通过环境变量注入，见 DEPLOY.md

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/aiscene?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:aiscene}
    password: ${DB_PASSWORD}
    hikari:
      # 2GB 小机器：连接池 5 是有意为之，加大池是错药（瓶颈在事务边界，见 docs/p0-tx-and-scheduler-refactor.md）
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

server:
  tomcat:
    threads:
      max: 30
      min-spare: 5
    max-swallow-size: 64MB
    max-http-form-post-size: 64MB

upload:
  path: /app/uploads/
  base-url: ${UPLOAD_BASE_URL:https://your-domain.com/api}

app:
  redis:
    # 2GB 机器不跑 Redis：显式关闭（会话本就 store-type none，Redis 仅缓存）
    mode: off

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:${APP_DEPLOY_HOST:http://localhost}}

knife4j:
  enable: false
