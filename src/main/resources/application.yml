spring:
  config:
    import: optional:classpath:application-local.yml,optional:file:./application-local.yml
  application:
    name: scene-ai-code-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/aiscene?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      ttl: 86400
  session:
    store-type: none
    timeout: 24h

server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 24h
      cookie:
        max-age: 24h

springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ai.controller
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

knife4j:
  enable: true
  setting:
    language: zh_cn

langchain4j:
  open-ai:
    streaming-chat-model:
      base-url: ${CODEGEN_API_BASE_URL:http://127.0.0.1:14514/v1}
      api-key: ${CODEGEN_API_KEY:}
      model-name: ${CODEGEN_MODEL_NAME:deepseek-v4-flash}
      max-tokens: 8192
      log-requests: true
      log-responses: true
    chat-model:
      base-url: ${DASHSCOPE_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen-flash
      max-tokens: 256
      temperature: 0.1
      timeout: 5s
    agent-chat-model:
      base-url: ${DASHSCOPE_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen-plus
      max-tokens: 4096
      temperature: 0.3
      timeout-seconds: 60

chat:
  agent:
    enabled: true
    max-steps: 8
    history-limit: 20
    l2-enabled: false
  attachment-cache-ttl-minutes: 120
  image-caption:
    enabled: true
    base-url: ${DASHSCOPE_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${CHAT_IMAGE_CAPTION_API_KEY:}
    model-name: qwen3.6-flash
    prompt: "请用中文详细描述这张图片：包括画面主体、场景、颜色、文字内容（如有）、人物动作与情绪。只输出描述，不要提问。"
    timeout-seconds: 30
  segmentation:
    enabled: true
    style: natural
    min-length: 15
    max-segments: 8
    temperature: 0.1
    max-tokens: 256
    timeout-seconds: 5
    delay-base: 0.35
    delay-per-char: 0.015
    delay-max: 1.2
    fallback-to-rules: true

upload:
  path: ${UPLOAD_PATH:./tmp/uploads/}
  access-path: /uploads/**
  base-url: ${UPLOAD_BASE_URL:http://localhost:8123/api}
  max-file-size: 20

gpt-sovits:
  base-url: ${GPT_SOVITS_BASE_URL:http://127.0.0.1:9880}
  connect-timeout-ms: 5000
  read-timeout-ms: 120000
  ref-audio:
    upload-dir: ${GPT_SOVITS_REF_DIR:./tmp/tts-ref/}
    max-size-mb: 10
    allowed-ext: wav,mp3
  seed-voice:
    enabled: ${GPT_SOVITS_SEED_ENABLED:false}
    name: 达妮娅
    ref-audio-path: ${GPT_SOVITS_SEED_REF_PATH:}
    prompt-text: ${GPT_SOVITS_SEED_PROMPT:}
    prompt-lang: zh
    text-lang: zh

astrbot:
  base-url: ${ASTRBOT_BASE_URL:http://127.0.0.1:6185}
  api-key: ${ASTRBOT_API_KEY:}
  connect-timeout-ms: 5000
  read-timeout-ms: 300000

knowledge:
  minio:
    enabled: ${KNOWLEDGE_MINIO_ENABLED:true}
    endpoint: ${KNOWLEDGE_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${KNOWLEDGE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${KNOWLEDGE_MINIO_SECRET_KEY:minioadmin}
    bucket-documents: ${KNOWLEDGE_MINIO_BUCKET_DOCUMENTS:knowledge-documents}
    presign-expire-seconds: ${KNOWLEDGE_MINIO_PRESIGN_EXPIRE_SECONDS:3600}
  vector:
    datasource:
      url: ${KNOWLEDGE_VECTOR_DB_URL:jdbc:postgresql://localhost:5432/knowledge_ai}
      username: ${KNOWLEDGE_VECTOR_DB_USERNAME:kai}
      password: ${KNOWLEDGE_VECTOR_DB_PASSWORD:kai123}
  ai:
    base-url: ${KNOWLEDGE_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${KNOWLEDGE_AI_API_KEY:}
    chat-model: ${KNOWLEDGE_AI_CHAT_MODEL:deepseek-v3}
    embedding-model: ${KNOWLEDGE_AI_EMBEDDING_MODEL:text-embedding-v2}
    embedding-dimension: ${KNOWLEDGE_AI_EMBEDDING_DIMENSION:1536}
    temperature: ${KNOWLEDGE_AI_TEMPERATURE:0.2}
    max-tokens: ${KNOWLEDGE_AI_MAX_TOKENS:2048}
    timeout-seconds: ${KNOWLEDGE_AI_TIMEOUT_SECONDS:120}
  jina:
    base-url: ${KNOWLEDGE_JINA_BASE_URL:https://r.jina.ai/}
    timeout-seconds: ${KNOWLEDGE_JINA_TIMEOUT_SECONDS:30}
  tavily:
    api-key: ${KNOWLEDGE_TAVILY_API_KEY:}
    base-url: ${KNOWLEDGE_TAVILY_BASE_URL:https://api.tavily.com}
    max-results: ${KNOWLEDGE_TAVILY_MAX_RESULTS:5}
    timeout-seconds: ${KNOWLEDGE_TAVILY_TIMEOUT_SECONDS:30}
  deepseek:
    api-key: ${KNOWLEDGE_DEEPSEEK_API_KEY:}
    base-url: ${KNOWLEDGE_DEEPSEEK_BASE_URL:https://api.deepseek.com/anthropic}
    model: ${KNOWLEDGE_DEEPSEEK_MODEL:deepseek-v4-pro}
    search-model: ${KNOWLEDGE_DEEPSEEK_SEARCH_MODEL:deepseek-v4-flash}
    reading-model: ${KNOWLEDGE_DEEPSEEK_READING_MODEL:deepseek-v4-flash}
    distill-model: ${KNOWLEDGE_DEEPSEEK_DISTILL_MODEL:deepseek-v4-pro}
    max-results: ${KNOWLEDGE_DEEPSEEK_MAX_RESULTS:8}
    timeout-seconds: ${KNOWLEDGE_DEEPSEEK_TIMEOUT_SECONDS:120}
  rag:
    top-k: ${KNOWLEDGE_RAG_TOP_K:5}
    chunk-size: ${KNOWLEDGE_RAG_CHUNK_SIZE:1200}
    chunk-overlap: ${KNOWLEDGE_RAG_CHUNK_OVERLAP:150}

app:
  redis:
    mode: auto
    ping-timeout-ms: 2000
  modules:
    ops: true
    blog: true
    knowledge: true
    reading: true
    chat: true
    study: true
    diary: true
    worklog: true
    tts: true
    app-lab: true
  deploy:
    host: ${APP_DEPLOY_HOST:http://localhost}
    code-output-dir: ${APP_CODE_OUTPUT_DIR:}
    code-deploy-dir: ${APP_CODE_DEPLOY_DIR:}

# 全站设置敏感字段加密主密钥（勿写入 DB；生产务必通过环境变量覆盖）
site-setting:
  crypto-secret: ${SITE_SETTING_CRYPTO_SECRET:}
